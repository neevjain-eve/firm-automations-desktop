name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "twa-manifest.json"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/build.gradle', 'twa-manifest.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Point Bubblewrap at the pre-installed JDK/SDK (skip interactive install)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          cat "$HOME/.bubblewrap/config.json"

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Install expect
        run: sudo apt-get update -y && sudo apt-get install -y expect

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > build.exp <<'EOF'
          #!/usr/bin/expect -f
          set timeout 600
          log_user 1
          set send_slow {1 20}
          spawn bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json

          # These prompts change/disappear between renders, so a looping match is safe.
          expect {
            -re "\\(Y/n\\)" { send -s "Y\r" }
            timeout { puts "TIMED OUT waiting for regenerate prompt"; exit 1 }
          }
          expect {
            -re "versionName" { send -s "1.0.1\r" }
            timeout { puts "TIMED OUT waiting for versionName prompt"; exit 1 }
          }

          # Password prompts re-render the SAME label text on every keystroke
          # (masked with growing *), so each of these must match and answer
          # exactly once -- no exp_continue here, or the password gets sent
          # repeatedly and mangled.
          expect {
            -re "Password for the Key Store" { send -s "$env(KEYSTORE_PASSWORD)\r" }
            timeout { puts "TIMED OUT waiting for keystore password prompt"; exit 1 }
          }
          expect {
            -re "Password for the Key:" { send -s "$env(KEY_PASSWORD)\r" }
            timeout { puts "TIMED OUT waiting for key password prompt"; exit 1 }
          }

          expect eof
          catch wait result
          exit [lindex $result 3]
          EOF
          chmod +x build.exp
          expect build.exp

      - name: Locate build output
        run: find . -maxdepth 2 -iname "*.apk" -o -iname "*.aab" 2>/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: firm-app-release-apk
          path: |
            app-release-signed.apk
            *.apk
          if-no-files-found: warn

      - name: Upload AAB artifact (Play Store bundle, if produced)
        uses: actions/upload-artifact@v4
        with:
          name: firm-app-release-aab
          path: |
            app-release-bundle.aab
            *.aab
          if-no-files-found: ignore
